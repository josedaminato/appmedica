name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: appmedica
          POSTGRES_PASSWORD: appmedica_secret
          POSTGRES_DB: appmedica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appmedica -d appmedica_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://appmedica:appmedica_secret@localhost:5432/appmedica_test
      TEST_DATABASE_URL: postgresql+psycopg://appmedica:appmedica_secret@localhost:5432/appmedica_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio
      - run: alembic upgrade head
      - run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
